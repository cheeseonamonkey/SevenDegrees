name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
      - run: python3 scripts/bulk_test.py
      - run: python3 scripts/schema.py --check
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore semantic --locked-mode
      - run: dotnet build semantic --no-restore
      - run: dotnet run --project semantic --no-build -- validate snapshots/seed.nt ontology/shapes.ttl
      - run: dotnet run --project semantic --no-build -- query snapshots/seed.nt queries/relationship-counts.rq
      - run: scripts/pages.sh .cache/pages
      - run: node scripts/pages-test.js .cache/pages/api/v1/graph.json.gz
      - run: go build -o degrees .
      - run: |
          ./degrees import corpus/*.jsonl
          ./degrees find "Tom Morello" "David Bowie"
