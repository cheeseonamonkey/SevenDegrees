<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark"><title>SevenDegrees — Everything is connected.</title><link rel="stylesheet" href="style.css"><script src="graph.js" defer></script><script src="app.js" defer></script></head>
<body><main><header><span class="eyebrow">THE MUSIC CONNECTION GAME</span><h1>Seven<span>Degrees.</span></h1><p>Two artists. Seven degrees. Every connection needs a reason.</p><small id="stats"></small></header>
<form id="search"><div class="fields"><label>START ARTIST<input id="from" value="Tom Morello" placeholder="Search artists" autocomplete="off" required><div id="from-options" class="options"></div></label><span class="join">↔</span><label>DESTINATION<input id="to" value="David Bowie" placeholder="Search artists" autocomplete="off" required><div id="to-options" class="options"></div></label></div><div class="actions"><label class="check"><input type="checkbox" id="strict"> Exclude covers and tributes</label><button type="submit">Find the connection <span>↗</span></button></div></form>
<section id="result" aria-live="polite"><p>Pick two artists to discover a path through the graph.</p></section>
<footer>Evidence-backed music relationships · MusicBrainz &amp; Wikidata · <a href="https://github.com/cheeseonamonkey/SevenDegrees">Source</a></footer></main></body></html>
