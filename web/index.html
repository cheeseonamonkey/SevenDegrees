<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#181818">
<title>MusicAtlas — Explore musical connections</title>
<link rel="stylesheet" href="style.css">
<script src="cytoscape.min.js" defer></script>
<script src="relationships.js" defer></script>
<script src="viewer.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<header class="topbar">
 <a class="brand" href="./">MusicAtlas</a>
 <span id="stats" class="muted">Loading index…</span>
 <nav><button id="reset" type="button">Reset</button><a href="api/v1/manifest.json" id="api-link" hidden>API</a><a href="https://github.com/cheeseonamonkey/MusicAtlas/releases">Data</a><a href="https://github.com/cheeseonamonkey/MusicAtlas">Source</a></nav>
</header>
<div class="toolbar">
 <div class="modes"><button id="overview" type="button">Atlas</button><button id="mode" type="button" aria-pressed="false">Find path</button></div>
 <form id="search" role="search">
  <div class="field"><label class="sr-only" for="from">Artist</label><input id="from" placeholder="Search people or bands" autocomplete="off" required><div class="options" id="from-options" hidden></div></div>
  <div class="field" id="destination" hidden><label class="sr-only" for="to">Destination</label><input id="to" placeholder="Connect to…" autocomplete="off"><div class="options" id="to-options" hidden></div></div>
  <button id="submit" class="primary" type="submit">Explore</button>
 </form>
 <details id="filters"><summary>Relationships <span id="filter-count"></span></summary><div class="filter-panel"><div id="filter-options"></div><div class="filter-actions"><button id="all-types" type="button">All</button><button id="no-types" type="button">None</button></div></div></details>
</div>
<div class="tabs" role="group" aria-label="Result view"><button id="map-tab" type="button" aria-pressed="true">Map</button><button id="connections-tab" type="button" aria-pressed="false">Connections</button></div>
<div class="map-tools">
 <div id="dimension" role="group" aria-label="Map dimension"><button type="button" data-dimension="2D" aria-pressed="true">2D</button><button type="button" data-dimension="3D" aria-pressed="false">3D</button></div>
 <button id="fit" type="button">Fit</button><button id="layout-button" type="button" aria-expanded="false">Settings</button><button id="expand-selected" type="button" disabled>Expand</button>
 <span id="selection"></span>
</div>
  <section id="layout-panel" hidden aria-label="Graph layout controls"><label>Layout <select id="layout-mode"><option value="force">Force-directed</option><option value="cluster">By relationship type</option></select></label><label>Spacing <input id="spacing" type="range" min="35" max="120" value="65"></label><label>Node size <input id="node-size" type="range" min="0.5" max="2" step="0.1" value="1"></label><label>Degree influence <input id="degree-size" type="range" min="0" max="2" step="0.1" value="0.6"></label><label>Repulsion <input id="repulsion" type="range" min="0.3" max="3" step="0.1" value="1.4"></label><label>Label size <input id="label-size" type="range" min="0.5" max="1.5" step="0.1" value="1"></label><label><input id="labels" type="checkbox" checked> Labels</label><button id="relayout" type="button">Reorganize</button><hr>
<label>Rank by <select id="ranking"><option value="popular">Popularity</option><option value="degree">Graph backlinks</option><option value="balanced">More diversity</option></select></label>
<label>Random variation <input id="variation" type="number" min="0" max="1" step="0.05" value="0.12"></label>
<label>Draw fraction <input id="fraction" type="number" min="0" max="1" step="0.05" value="0.4"></label>
<label>Decay per hop <input id="decay" type="number" min="0" max="1" step="0.1" value="0.5"></label>
<label>Depth <input id="depth" type="number" min="1" max="4" step="1" value="2"></label>
<label>Max per artist <input id="max-branch" type="number" min="1" max="100" value="16"></label>
<label>Max connections <input id="max-connections" type="number" min="0" max="500" value="100"></label>
<button id="generate-map" type="button" disabled>Generate web</button><button id="connect-map" type="button" disabled>Connect mapped artists</button><p><button id="export" type="button">Export JSON</button></p></section>
<div id="status" role="status" aria-live="polite"></div>
<main class="workspace">
 <section class="map-pane" aria-label="Music relationship map">
  <div id="network"></div>
  <div class="map-caption"><span id="map-count"></span><span id="legend"><i class="person"></i> Person <i class="group"></i> Group <i class="unknown"></i> Other / unknown</span><span id="edge-legend"></span></div>


 </section>
 <aside hidden class="inspector" aria-label="Map inspector">
  <div id="detail"></div><div id="records" aria-live="polite"></div>
 </aside>
</main>
</body>
</html>
