<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MusicAtlas</title>
<link rel="stylesheet" href="style.css">
<script src="cytoscape.min.js" defer></script>
<script src="relationships.js" defer></script>
<script src="viewer.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<main>
<header><h1>MusicAtlas</h1><p>Explore the relationships behind music.</p><small id="stats"></small></header>
<nav aria-label="Tools">
<button type="button" data-mode="explore" aria-pressed="true">Explore map</button>
<button type="button" data-mode="path" aria-pressed="false">Find connections</button>
<button type="button" id="reset">Reset</button>
</nav>
<form id="search">
<div class="fields">
<div class="field"><label for="from">Artist</label><input id="from" placeholder="Artist or band" autocomplete="off" required><div id="from-options" class="options"></div></div>
<div class="field" id="destination" hidden><label for="to">Destination</label><input id="to" placeholder="Artist or band" autocomplete="off"><div id="to-options" class="options"></div></div>
</div>
<details id="filters"><summary>Relationships <small id="filter-count"></small></summary><div id="filter-options"></div></details>
<details id="settings"><summary>Settings <small id="settings-summary"></small></summary>
<div id="generation-settings">
<label>Rank by <select id="ranking"><option value="popular">Popularity</option><option value="degree">Connectivity</option><option value="balanced">More diversity</option></select></label>
<label title="Fraction of eligible connections, limited by the caps below">Draw fraction <input id="fraction" type="range" min="0" max="1" step="0.05" value="0.4"></label>
<label title="Reduces the branch budget at each additional hop">Decay <input id="decay" type="range" min="0" max="1" step="0.05" value="0.5"></label>
<label>Depth <input id="depth" type="number" min="1" max="4" value="1"></label>
<label>Max per artist <input id="max-branch" type="number" min="1" max="100" value="16"></label>
<label>Max connections <input id="max-connections" type="number" min="0" max="500" value="100"></label>
<label>Variation <input id="variation" type="range" min="0" max="1" step="0.01" value="0.12"></label>
<button id="shuffle" type="button" disabled>Shuffle</button> <small id="generation-summary" aria-live="polite"></small>
<label><input id="cross-links" type="checkbox"> Connect artists already on map</label>
</div>
<small class="settings-note">Generation changes rebuild the map. Appearance changes keep it intact.</small>
<div id="layout-settings">
<label>Layout <select id="layout-mode"><option value="force">Force-directed</option><option value="cluster">By relationship type</option></select></label>
<label>Spacing <input id="spacing" type="range" min="35" max="120" value="65"></label>
<label>Node size <input id="node-size" type="range" min="0.5" max="2" step="0.1" value="1"></label>
<label>Degree influence <input id="degree-size" type="range" min="0" max="2" step="0.1" value="0.6"></label>
<label>Repulsion <input id="repulsion" type="range" min="0.3" max="3" step="0.1" value="1.4"></label>
<label>Label size <input id="label-size" type="range" min="0.5" max="1.5" step="0.1" value="1"></label>
<label><input id="labels" type="checkbox" checked> Labels</label>
</div>
<p><button id="overview" type="button">Community overview</button> <button id="export" type="button" disabled>Export JSON</button></p>
</details>
<div class="actions"><button id="submit" type="submit">Explore</button></div>
</form>
<section id="result" aria-live="polite"></section>
<div id="status" role="status" aria-live="polite"></div>
<div id="map-tools" hidden>
<div id="dimension" role="group" aria-label="Map dimension"><button type="button" data-dimension="2D" aria-pressed="true">2D</button><button type="button" data-dimension="3D" aria-pressed="false">3D</button></div>
<button id="fit" type="button">Fit</button><small id="map-count"></small>
</div>
<section id="detail" aria-live="polite"></section>
<div id="network" hidden aria-label="Interactive graph"></div>
<section id="records" aria-live="polite"></section>
<footer><a href="https://github.com/cheeseonamonkey/MusicAtlas">Source</a> · <a href="https://github.com/cheeseonamonkey/MusicAtlas/releases/tag/owl-mb-20261125-002239">OWL data</a> · <a href="api/v1/manifest.json" id="api-link" hidden>Data API</a></footer>
</main>
</body>
</html>
